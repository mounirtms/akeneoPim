# Translation files - catch-all to prevent 404s
pim_translation_spa:
    path: /_translation/{catchall}
    defaults:
        _controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController::templateAction()
        template: '@PimUI/translation.html.twig'
    requirements:
        catchall: .+
