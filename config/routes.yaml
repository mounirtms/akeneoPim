# Akeneo PIM - SPA Route Fallback Configuration
# These routes serve the SPA shell so client-side routing works on direct URL access

# Products
pim_enrich_product_spa:
    path: /enrich/product/
    defaults:
        _controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController::templateAction()
        template: '@PimUI/index.html.twig'

# Import profiles
pim_import_profile_spa:
    path: /collect/import/
    defaults:
        _controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController::templateAction()
        template: '@PimUI/index.html.twig'

# Export profiles
pim_export_profile_spa:
    path: /spread/export/
    defaults:
        _controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController::templateAction()
