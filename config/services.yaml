parameters:
    locale: 'en'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # AppBundle classes (src/AppBundle/)
    AppBundle\:
        resource: '../../src/AppBundle/*'
        exclude: '../../src/AppBundle/{Entity,Tests}'

    AppBundle\Controller\:
        resource: '../../src/AppBundle/Controller'
        tags: ['controller.service_arguments']

    # App classes (src/ outside AppBundle, e.g. src/EventSubscriber/)
    App\:
        resource: '../../src/'
        exclude: '../../src/{AppBundle,Entity,Migrations,Tests,Kernel.php}'
