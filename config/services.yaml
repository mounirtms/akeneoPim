parameters:
    locale: 'en'
    secret: '%env(APP_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # make classes in src/ available as services, but exclude AppBundle
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/AppBundle/'

    # controllers (allow DI in controller action arguments)
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # PDO session handler (single definition)
    session.handler.pdo:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        arguments:
            - '%env(SESSION_DSN)%'
            - { db_username: '%env(DB_USER)%', db_password: '%env(DB_PASSWORD)%', db_table: 'pim_session' }
