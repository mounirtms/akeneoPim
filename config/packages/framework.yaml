framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: true
    handle_all_throwables: true
    php_errors:
        log: true

    session:
        cookie_secure: auto
        cookie_samesite: lax
        handler_id: 'session.handler.pdo'
        name: 'PIMSESSID'
        
    esi: true
    fragments: true
    http_cache: true
