framework:
    translator:
        fallback: en_US
    secret: '%env(APP_SECRET)%'
    router:
        strict_requirements: '%env(APP_DEBUG)%'
        default_uri: '%env(AKENEO_PIM_URL)%'
    form: true
    csrf_protection: true
    validation:
        enable_annotations: true
        enabled: true
    default_locale: '%env(APP_DEFAULT_LOCALE)%'
    session:
        name: BAPID
        handler_id: ~
        cookie_domain: 'pim.technostationery.com'
        cookie_samesite: 'lax'
        cookie_secure: true
        cookie_httponly: true
        gc_maxlifetime: 86400
    serializer:
        enabled: true
    http_method_override: true
    trusted_proxies: '173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1,::1'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
    assets:
        packages:
            frontend:
                version_strategy: pim_enrich.version_strategy
    cache:
        app: cache.adapter.filesystem
        system: cache.adapter.system
        default_memcached_provider: 'memcached://localhost'
        pools:
            doctrine.result_cache_pool:
                adapters:
                    - cache.adapter.filesystem
                    - cache.adapter.array
            doctrine.system_cache_pool:
                adapter: cache.system
